<!--
    ************************************************************************
    STREAMVOICE GHOST OVERLAY - SETUP DIRECTIONS
    ************************************************************************
    1. CONFIGURATION:
       Scroll down to the <script> section (around line 100) and change 
       the 'CHANNEL_NAME' variable from "CHANGE_ME" to your Twitch username.

    2. OBS / STREAMLABS SETUP:
       - Add a new "Browser Source" to your scene.
       - Check "Local file" and select this .html file, or enter the URL 
         if you have hosted it on GitHub Pages.
       - Set the Width and Height to match your stream (e.g., 1920x1080).
       - Keep "Shutdown source when not visible" checked to save resources.

    3. CUSTOMIZATION:
       - FADE TIME: Change 'MESSAGE_LIFETIME' to adjust how long 
         messages stay on screen.
       - COLORS: Edit the CSS in the <style> block to change the 
         font size, background opacity, or border thickness.

    4. GHOST MODE:
       This overlay is completely invisible until someone chats. To test 
       it, type something in your own Twitch chat once the source is active.
    ************************************************************************
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVoice Ghost Overlay</title>
    <style>
        /* Transparent Background for OBS capture */
        body, html {
            background-color: rgba(0, 0, 0, 0); 
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* Container for the chat messages */
        #chat-log {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100vh;
            padding: 25px;
            gap: 10px;
            mask-image: linear-gradient(to top, black 80%, transparent 100%);
        }

        /* Message Styling */
        .msg {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(8px);
            color: white;
            padding: 14px 18px;
            border-radius: 10px;
            border-left: 5px solid #a970ff;
            font-size: 1.2rem;
            max-width: 550px;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .username { font-weight: 900; margin-right: 8px; }

        /* TTS Reading Badge */
        #hud {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #a970ff;
            color: black;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.75rem;
            display: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="hud">🎙️ Reading: <span id="hud-user"></span></div>
<div id="chat-log"></div>

<script>
    /* --- CONFIGURATION --- */
    const CHANNEL_NAME = "CHANGE_ME"; // Set your Twitch name here
    const VOLUME = 0.7;                // 0.0 to 1.0
    const RATE = 1.1;                  // Speech speed
    const MAX_VISIBLE_MSGS = 5;        // Messages visible at once
    const MESSAGE_LIFETIME = 15000;    // Time before fade (15 seconds)

    /* --- LOGIC ENGINE --- */
    let socket, speechQueue = [], isSpeaking = false;
    const logElement = document.getElementById('chat-log');
    const hudElement = document.getElementById('hud');

    function connect() {
        if (CHANNEL_NAME === "CHANGE_ME") return;

        socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
        
        socket.onopen = () => {
            socket.send('CAP REQ :twitch.tv/tags');
            socket.send('PASS oauth:none');
            socket.send('NICK justinfan' + Math.floor(Math.random() * 8888));
            socket.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);
            console.log("StreamVoice Connected.");
        };

        socket.onmessage = (event) => {
            if (event.data.startsWith('PING')) {
                socket.send('PONG :tmi.twitch.tv');
            } else if (event.data.includes('PRIVMSG')) {
                handleMessage(event.data);
            }
        };

        socket.onclose = () => setTimeout(connect, 3000);
    }

    function handleMessage(raw) {
        const tags = raw.split(' ')[0];
        const user = raw.match(/display-name=([^;]+)/)?.[1] || "Chatter";
        const color = raw.match(/color=([^;]+)/)?.[1] || "#a970ff";
        const isMod = tags.includes('mod=1') || tags.includes('broadcaster/1');
        
        const textIdx = raw.indexOf(':', raw.indexOf('PRIVMSG'));
        let text = raw.substring(textIdx + 1).trim();

        // Emote Filter
        const emoteData = tags.match(/emotes=([^;]+)/);
        if (emoteData) {
            let ranges = [];
            emoteData[1].split('/').forEach(em => {
                em.split(':')[1].split(',').forEach(p => {
                    const [s, e] = p.split('-').map(Number);
                    ranges.push({ s, e });
                });
            });
            ranges.sort((a, b) => b.s - a.s);
            let arr = Array.from(text);
            ranges.forEach(r => arr.splice(r.s, (r.e - r.s) + 1));
            text = arr.join('').trim();
        }

        if (text.startsWith('!') || text.length < 1) return;

        // Visual Message
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg';
        msgDiv.style.borderLeftColor = isMod ? '#22c55e' : color;
        msgDiv.innerHTML = `<span class="username" style="color:${color}">${user}:</span> <span>${raw.substring(textIdx + 1).trim()}</span>`;
        logElement.appendChild(msgDiv);

        if (logElement.childNodes.length > MAX_VISIBLE_MSGS) logElement.removeChild(logElement.firstChild);
        
        // Expiry
        setTimeout(() => {
            msgDiv.style.transition = 'opacity 1s ease';
            msgDiv.style.opacity = '0';
        }, MESSAGE_LIFETIME);
        setTimeout(() => msgDiv.remove(), MESSAGE_LIFETIME + 1000);

        // Queue Speech
        speechQueue.push({ user, text });
        runSpeech();
    }

    function runSpeech() {
        if (isSpeaking || speechQueue.length === 0) return;
        isSpeaking = true;
        const current = speechQueue.shift();
        
        hudElement.style.display = 'block';
        document.getElementById('hud-user').innerText = current.user;

        const utter = new SpeechSynthesisUtterance(`${current.user} says ${current.text}`);
        utter.volume = VOLUME;
        utter.rate = RATE + (speechQueue.length > 2 ? 0.3 : 0);
        
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) utter.voice = voices[current.user.length % voices.length];

        utter.onend = () => {
            isSpeaking = false;
            hudElement.style.display = 'none';
            runSpeech();
        };
        window.speechSynthesis.speak(utter);
    }

    connect();
</script>
</body>
</html>
