<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Chat Architect: V23.1 Glow Master</title>
    <style>
        :root { --accent-main: #6366f1; --accent-alt: #a855f7; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', system-ui, sans-serif; background: #070708; color: #fff; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 380px; background: #0f0f12; padding: 20px; border-right: 1px solid #1f1f23; overflow-y: auto; scrollbar-width: none; }
        .sidebar::-webkit-scrollbar { display: none; }

        /* PREVIEW AREA */
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; background: #000; position: relative; }
        #preview-window { 
            flex: 1; border: 1px solid #1f1f23; border-radius: 20px; padding: 25px; 
            display: flex; flex-direction: column; justify-content: flex-end; 
            background: radial-gradient(circle at center, #0a0a0c 0%, #000 100%);
        }
        
        /* FORM COMPONENTS */
        .section-header { font-size: 10px; font-weight: 900; color: #6366f1; text-transform: uppercase; letter-spacing: 2px; margin: 25px 0 12px 0; border-left: 3px solid #6366f1; padding-left: 10px; }
        .control { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
        label b { color: #fff; }

        input, select { width: 100%; background: #16161a; border: 1px solid #2d2d35; color: white; padding: 10px; border-radius: 10px; font-size: 12px; }
        input[type="range"] { -webkit-appearance: none; background: #2d2d35; height: 4px; border: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #6366f1; border-radius: 50%; cursor: pointer; }

        /* ACTION BUTTONS */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn { padding: 12px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 11px; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; }
        .btn-secondary { background: #1f1f23; color: #fff; border: 1px solid #2d2d35; }
        
        .code-output { height: 140px; background: #000; color: #a1a1aa; padding: 15px; font-family: 'Monaco', monospace; font-size: 11px; margin-top: 15px; border: 1px solid #1f1f23; border-radius: 12px; overflow: auto; }
    </style>
    <style id="live-styles"></style>
</head>
<body>

<div class="sidebar">
    <div style="font-size: 1.4rem; font-weight: 900; margin-bottom: 5px;">ARCHITECT <span style="color:#6366f1">V23.1</span></div>
    
    <div class="section-header">CHANNELS</div>
    <div class="control">
        <label>Twitch Channel</label>
        <input type="text" id="twitchChannel" value="YourChannel" oninput="run()">
    </div>

    <div class="section-header">TEXT SHADOW & GLOW</div>
    <div class="control">
        <label>Text Shadow Intensity <b><span id="shdLab">2</span>px</b></label>
        <input type="range" id="textShadow" min="0" max="8" step="1" value="2" oninput="run()">
    </div>
    <div class="control">
        <label>Accent Glow <b><span id="glwLab">0</span>px</b></label>
        <input type="range" id="accentGlow" min="0" max="20" step="1" value="0" oninput="run()">
    </div>

    <div class="section-header">STYLING</div>
    <div class="control">
        <label>Accents (Gradient)</label>
        <div style="display:flex; gap:5px;">
            <input type="color" id="accent1" value="#6366f1" oninput="run()">
            <input type="color" id="accent2" value="#a855f7" oninput="run()">
        </div>
    </div>
    <div class="control">
        <label>Box Opacity <b><span id="tntLab">20</span>%</b></label>
        <input type="range" id="tint" min="0" max="100" value="20" oninput="run()">
    </div>

    <div class="section-header">GEOMETRY</div>
    <div class="control">
        <label>Max Width <b><span id="wdLab">400</span>px</b></label>
        <input type="range" id="maxWidth" min="200" max="800" step="10" value="400" oninput="run()">
    </div>
    <div class="control">
        <label>Rounding <b><span id="rdLab">15</span>px</b></label>
        <input type="range" id="radius" min="0" max="50" value="15" oninput="run()">
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="addMessage()">TEST CHAT</button>
        <button class="btn btn-secondary" onclick="clearChat()">CLEAR</button>
    </div>
</div>

<div class="main">
    <div id="preview-window"></div>
    <div class="code-output" id="code-output"></div>
    <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="copyToClipboard()">COPY GENERATED CODE</button>
</div>

<script>
    function hexToRgba(hex, alpha) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function run() {
        const chan = document.getElementById('twitchChannel').value;
        const c1 = document.getElementById('accent1').value;
        const c2 = document.getElementById('accent2').value;
        const tint = document.getElementById('tint').value / 100;
        const width = document.getElementById('maxWidth').value;
        const radius = document.getElementById('radius').value;
        const ts = document.getElementById('textShadow').value;
        const glow = document.getElementById('accentGlow').value;
        
        document.getElementById('tntLab').innerText = Math.round(tint * 100);
        document.getElementById('wdLab').innerText = width;
        document.getElementById('rdLab').innerText = radius;
        document.getElementById('shdLab').innerText = ts;
        document.getElementById('glwLab').innerText = glow;

        const shadowCSS = ts > 0 ? `${ts}px ${ts}px ${ts}px rgba(0,0,0,0.8)` : 'none';
        const glowCSS = glow > 0 ? `0 0 ${glow}px ${c1}` : 'none';

        const cssTemplate = `.chat-line {
    background: ${hexToRgba(c1, tint)};
    backdrop-filter: blur(12px);
    border-left: 4px solid;
    border-image: linear-gradient(to bottom, ${c1}, ${c2}) 1;
    border-radius: ${radius}px;
    padding: 12px 18px;
    margin-bottom: 10px;
    max-width: ${width}px;
    width: fit-content;
    text-shadow: ${shadowCSS};
    animation: chatIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.user { 
    background: linear-gradient(90deg, ${c1}, ${c2});
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900; 
    margin-right: 8px; 
    filter: drop-shadow(${glowCSS});
}
.msg { color: #fff; line-height: 1.5; font-size: 15px; }
@keyframes chatIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`;

        const fullOutput = `<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"><\/script>
  <style>
    body { background: transparent; overflow: hidden; margin: 0; padding: 20px; font-family: 'Inter', sans-serif; }
    #chat-log { display: flex; flex-direction: column; justify-content: flex-end; height: 100vh; }
    ${cssTemplate}
  </style>
</head>
<body>
  <div id="chat-log"></div>
  <script>
    ComfyJS.onChat = (user, message) => {
      const log = document.getElementById('chat-log');
      const div = document.createElement('div');
      div.className = 'chat-line';
      div.innerHTML = \`<span class="user">\${user}:</span><span class="msg">\${message}</span>\`;
      log.appendChild(div);
      if(log.children.length > 25) log.removeChild(log.firstChild);
    };
    ComfyJS.Init("${chan}");
  <\/script>
</body>
</html>`;

        document.getElementById('code-output').innerText = fullOutput;
        document.getElementById('live-styles').innerHTML = cssTemplate.replace(/\.chat-line/g, '#preview-window .chat-line').replace(/\.user/g, '#preview-window .user');
    }

    function addMessage() {
        const wall = document.getElementById('preview-window');
        const msg = document.createElement('div');
        msg.className = 'chat-line';
        msg.innerHTML = `<span class="user">ShadowBot:</span><span class="msg">Check out the text shadow and accent glow!</span>`;
        wall.appendChild(msg);
        if(wall.children.length > 5) wall.removeChild(wall.firstChild);
        run();
    }

    function clearChat() { document.getElementById('preview-window').innerHTML = ''; }
    function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('code-output').innerText); alert("Code Copied!"); }

    run();
</script>
</body>
</html>
