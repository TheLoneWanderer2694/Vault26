<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Streamer Music Overlay</title>
    <style>
        /* CSS VARIABLES: Easy access to change colors and speeds in one place */
        :root {
            --accent-color: #ff0000;
            --bg-color: rgba(0, 0, 0, 0.95);
            --scroll-speed: 10s;
        }

        /* RESET & LAYOUT: Removes default browser margins and hides scrollbars */
        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            background-color: transparent; 
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* MAIN CONTAINER: The visible black box holding the song info */
        #overlay-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border-radius: 0 0 12px 12px;
            padding: 12px;
            width: 420px; 
            height: 60px;
            border-left: 6px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        /* SPECTRUM: The container for the 40 animated bars above the info box */
        #spectrum-container {
            width: 444px;
            height: 20px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 0;
            margin-bottom: -2px;
        }

        /* INDIVIDUAL BARS: Defines the look and base height of the spectrum bars */
        .bar {
            flex: 1;
            background: var(--accent-color);
            height: 3px;
            transition: height 0.2s ease;
        }

        /* ANIMATION TRIGGER: Only animates when the 'playing' class is added via JavaScript */
        .playing .bar {
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { height: 3px; }
            100% { height: 20px; }
        }

        /* VARIATION: Different animation speeds for bars to make it look organic */
        .bar:nth-child(2n) { animation-duration: 0.6s; }
        .bar:nth-child(3n) { animation-duration: 0.9s; }
        .bar:nth-child(4n) { animation-duration: 0.5s; }
        .bar:nth-child(5n) { animation-duration: 1.1s; }

        /* THUMBNAIL: The YouTube video cover art */
        #thumbnail {
            width: 100px; height: 56px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
            background: #222;
        }

        /* TEXT AREAS: Handles the title, author, and timer layout */
        .text-info {
            display: flex;
            flex-direction: column;
            color: var(--accent-color);
            flex-grow: 1;
            overflow: hidden;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 2px;
        }

        /* MARQUEE EFFECT: If a title is too long, this moves it left and right */
        #title-scroll-container { overflow: hidden; white-space: nowrap; width: 100%; }
        #song-title { font-size: 15px; font-weight: bold; display: inline-block; padding-right: 30px; }
        .scrolling #song-title { animation: scroll-left var(--scroll-speed) linear infinite; }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            15% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* HOVER CONTROLS: Hidden by default, appears when you mouse over the overlay in OBS */
        #controls {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 0 0 12px 12px;
            z-index: 10;
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.2s ease;
        }

        #overlay-wrapper:hover #controls { opacity: 1; pointer-events: auto; }

        #playlist-library {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 5px;
        }

        /* LIBRARY BUTTONS: Small buttons for switching playlists manually */
        .lib-item {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            color: white;
            cursor: pointer;
            border: 1px solid transparent;
            text-transform: uppercase;
        }
        .lib-item:hover { border-color: var(--accent-color); background: #444; }

        /* HIDDEN PLAYER: The actual YouTube video is invisible but plays the audio */
        #player { position: absolute; top: -9999px; }
    </style>
</head>
<body>

    <!-- VISUAL ELEMENTS -->
    <div id="spectrum-container"></div>

    <div id="overlay-wrapper">
        <div id="controls">
            <div class="nav-row">
                <button class="btn" onclick="player.previousVideo()">PREV</button>
                <button id="play-pause-btn" class="btn" onclick="togglePlay()">PAUSE</button>
                <button class="btn" onclick="player.nextVideo()">NEXT</button>
            </div>
            <div id="playlist-library"></div>
        </div>

        <img id="thumbnail" src="" alt="">
        <div class="text-info">
            <div class="meta-row">
                <span id="channel-name">LOADING...</span>
                <span id="timer">0:00 / 0:00</span>
            </div>
            <div id="title-scroll-container">
                <span id="song-title">Loading Playlist...</span>
            </div>
        </div>
    </div>

    <div id="player"></div>

    <script>
        // 1. GENERATE SPECTRUM BARS
        // Loops 40 times to create the DIVs for the visualizer
        const specCont = document.getElementById('spectrum-container');
        for(let i=0; i<40; i++) {
            let bar = document.createElement('div');
            bar.className = 'bar';
            specCont.appendChild(bar);
        }

        // 2. LOAD YOUTUBE IFRAME API
        // Dynamically adds the YouTube script so the player functions can work
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var player;
        const playlists = [
            { name: "Put Your Playlist Name Here", id: "Put Your Playlist ID Here" },
        ];

        let currentPlaylistName = playlists[0].name;

        // 3. INITIALIZE PLAYER
        // This runs automatically once the YouTube script is loaded
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                playerVars: { 
                    'autoplay': 1, 
                    'listType': 'playlist', 
                    'list': playlists[0].id,
                    'loop': 1 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 4. OBS COMMUNICATION BRIDGE
        // This is the core listener that waits for Streamer.bot to send a command via OBS
        window.addEventListener('music_cmd', function(event) {
            const action = event.detail.action;
            if (action === 'next') player.nextVideo();
            if (action === 'prev') player.previousVideo();
            if (action === 'toggle') togglePlay();
            
            // Logged for troubleshooting
            if (action === 'get_name') {
                console.log(`Currently listening to: ${currentPlaylistName}`);
            }
        });

        function onPlayerReady(event) {
            renderLibrary(); // Creates the buttons in the hover menu
            setInterval(updateTimer, 1000); // Starts the 0:00 / 0:00 clock
            player.setLoop(true); // Ensures the playlist repeats
            event.target.playVideo();
        }

        // 5. PLAY/PAUSE LOGIC
        // Checks the player state (1 = playing, 2 = paused) and switches it
        function togglePlay() {
            const state = player.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        // 6. UI UPDATER (The most important function)
        // This runs every time a song starts, stops, or ends
        function onPlayerStateChange(event) {
            const spec = document.getElementById('spectrum-container');
            const ppBtn = document.getElementById('play-pause-btn');

            // Force next song if YouTube fails to autoplay the next one
            if (event.data == YT.PlayerState.ENDED) {
                player.nextVideo();
            }

            // Update UI elements when a song is playing
            if (event.data == YT.PlayerState.PLAYING) {
                spec.classList.add('playing'); // Starts spectrum animation
                ppBtn.innerText = "PAUSE";
                
                const data = player.getVideoData();
                const titleEl = document.getElementById('song-title');
                const scrollContainer = document.getElementById('title-scroll-container');
                
                scrollContainer.classList.remove('scrolling');
                titleEl.innerText = data.title;
                document.getElementById('channel-name').innerText = data.author;
                document.getElementById('thumbnail').src = `https://img.youtube.com/vi/${data.video_id}/mqdefault.jpg`;

                // Calculate if the title is wider than the box; if so, start scrolling
                if (titleEl.scrollWidth > scrollContainer.offsetWidth) {
                    scrollContainer.classList.add('scrolling');
                }
            } else {
                spec.classList.remove('playing'); // Stops spectrum animation
                ppBtn.innerText = "PLAY";
            }
        }

        // 7. LIBRARY RENDERER
        // Loops through your 'playlists' array and creates the clickable buttons
        function renderLibrary() {
            const lib = document.getElementById('playlist-library');
            lib.innerHTML = "";
            playlists.forEach(p => {
                const div = document.createElement('div');
                div.className = 'lib-item';
                div.innerText = p.name;
                div.onclick = () => {
                    currentPlaylistName = p.name;
                    player.loadPlaylist({list: p.id});
                    player.setLoop(true);
                };
                lib.appendChild(div);
            });
        }

        // 8. TIMER CALCULATOR
        // Converts the raw seconds from YouTube into M:SS format
        function updateTimer() {
            if (player && player.getCurrentTime) {
                const curr = player.getCurrentTime();
                const total = player.getDuration();
                if (total > 0) {
                    document.getElementById('timer').innerText = formatTime(curr) + " / " + formatTime(total);
                }
            }
        }

        function formatTime(time) {
            time = Math.round(time);
            var m = Math.floor(time / 60);
            var s = time % 60;
            return m + ":" + (s < 10 ? '0' + s : s);
        }
    </script>
</body>
</html>
